name: Deploy Nova Ventures to Pages

on:
  push:
    branches: [claude/nova-ventures-3d-scroll-3q82r8]
    paths: [nova-ventures/**]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: nova-ventures
      - id: deployment
        uses: actions/deploy-pages@v4
